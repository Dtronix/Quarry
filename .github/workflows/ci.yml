name: CI

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Check if release
        id: release
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            echo "is_release=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_release=false" >> "$GITHUB_OUTPUT"
          fi

      # Deleted so the drift check below also proves the goldens were *regenerated*. A
      # diff-only check passes vacuously if the generator ever stops emitting them (property
      # renamed, props import broken, emitter early-return) — which is the failure mode this
      # gate exists to catch. The build recreates them via <QuarrySqlManifestPath>.
      - name: Delete SQL manifest goldens before building
        run: rm -f src/Quarry.Tests/ManifestOutput/quarry-manifest.*.md

      - name: Build
        run: dotnet build Quarry.sln -c Release

      - name: Test
        run: dotnet test Quarry.sln -c Release --no-build

      - name: Check SQL manifest goldens for drift
        run: |
          set -euo pipefail
          status=0

          for dialect in sqlite postgresql mysql sqlserver; do
            file="src/Quarry.Tests/ManifestOutput/quarry-manifest.${dialect}.md"
            if [ ! -s "$file" ]; then
              echo "::error::${file} was not regenerated by the build. The SQL manifest emitter is not running — check <QuarrySqlManifestPath> and the Quarry.Generator props import."
              status=1
            fi
          done

          git diff --exit-code -- src/Quarry.Tests/ManifestOutput \
            || { echo "::error::Generated SQL manifests differ from checked-in goldens. If the SQL change is intentional, rebuild locally and commit the updated ManifestOutput files."; status=1; }

          # git diff ignores untracked files, so a newly emitted dialect golden would escape.
          untracked=$(git ls-files --others --exclude-standard -- src/Quarry.Tests/ManifestOutput)
          if [ -n "$untracked" ]; then
            echo "::error::Untracked SQL manifest goldens were generated and must be committed:"
            echo "$untracked" | sed 's/^/::error::  /'
            status=1
          fi

          exit "$status"

      - name: Pack
        run: >-
          dotnet pack Quarry.sln
          -c Release
          --no-build
          -p:IncludeSymbols=true
          -p:SymbolPackageFormat=snupkg
          -o staging

      - name: Upload NuGet artifacts
        uses: actions/upload-artifact@v7
        with:
          name: nuget-packages
          path: staging/*

      - name: Push to NuGet
        if: steps.release.outputs.is_release == 'true'
        run: >-
          dotnet nuget push "staging/*.nupkg"
          --source https://api.nuget.org/v3/index.json
          --api-key ${{ secrets.ORG_NUGET_AUTH_TOKEN }}
          --skip-duplicate

      - name: Create GitHub Release
        if: steps.release.outputs.is_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            staging/*.nupkg
            staging/*.snupkg
