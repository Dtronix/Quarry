name: Benchmarks

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [master]
  workflow_dispatch:
    inputs:
      allow_missing_series:
        description: >-
          Accept benchmark series that disappeared since the last published run. Needed once
          after a deliberate benchmark rename or removal, otherwise every subsequent run keeps
          failing on the old name and no new baseline can ever be published.
        type: boolean
        default: false

concurrency:
  group: benchmark
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0

      - name: Check for benchmark-relevant changes
        id: check
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            echo "Manual trigger, running benchmarks"
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          LAST_SHA=$(curl -fsS https://raw.githubusercontent.com/Dtronix/Quarry-benchmarks/gh-pages/dev/bench/runs/runs.json 2>/dev/null \
            | jq -r '.[0].sha // empty' 2>/dev/null || echo "")

          if [ -z "$LAST_SHA" ]; then
            echo "No previous benchmark run found, running benchmarks"
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! git cat-file -e "$LAST_SHA" 2>/dev/null; then
            echo "Previous benchmark SHA $LAST_SHA not in history, running benchmarks"
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          CHANGED=$(git diff --name-only "$LAST_SHA" HEAD)
          echo "Changed files since $LAST_SHA:"
          echo "$CHANGED"

          if echo "$CHANGED" | grep -qE '^(src/Quarry/|src/Quarry\.Shared/|src/Quarry\.Generator/|src/Quarry\.Benchmarks/|src/Quarry\.Benchmarks\.Reporter/|\.github/workflows/benchmark\.yml|scripts/benchmark-pages/)'; then
            echo "Benchmark-relevant changes detected, running benchmarks"
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "No benchmark-relevant changes, skipping"
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          fi

  benchmark:
    needs: check
    if: needs.check.outputs.should_run == 'true'
    runs-on: debian-benchmark
    # Deliberately read-only. Filing the regression issue needs `issues: write`, but this job
    # also runs arbitrary project and NuGet code on a persistent self-hosted runner, so the
    # write scope lives in the separate `alert` job below instead.
    permissions:
      contents: read
    outputs:
      breaches: ${{ steps.perfgate.outputs.breaches }}

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Run benchmarks
        run: |
          dotnet run --project src/Quarry.Benchmarks -c Release \
            -- --filter '*' --artifacts BenchmarkDotNet.Artifacts

      - name: Merge benchmark results
        run: |
          # `select(.Statistics != null)` drops benchmarks that produced no
          # measurements so downstream jq does not have to null-guard. That
          # drop is no longer silent: the "Compare against previous benchmark
          # run" step below fails the workflow when a series that existed in
          # the last published run disappears here.
          jq -s '{
            Title: "Quarry Benchmarks",
            HostEnvironmentInfo: .[0].HostEnvironmentInfo,
            Benchmarks: [.[].Benchmarks[] | select(.Statistics != null)]
          }' BenchmarkDotNet.Artifacts/results/*-report-full.json \
            > BenchmarkDotNet.Artifacts/combined-results.json

      # ── Regression gate ───────────────────────────────────────────────────
      # Alert-only for performance: a mean regression >15% or any allocation
      # increase on a `Quarry_*` series opens a GitHub issue, it does not fail
      # the run — a benchmark box is noisy and a red workflow would train
      # people to ignore it. A *missing* series is different: that means a
      # benchmark crashed or was silently dropped, which is an infrastructure
      # failure rather than a performance judgement, so it does fail. Both run
      # before publishing so a broken run never becomes the stored baseline.
      - name: Compare against previous benchmark run
        id: perfgate
        run: |
          set -euo pipefail

          PREV_URL=https://raw.githubusercontent.com/Dtronix/Quarry-benchmarks/gh-pages/dev/bench/data.js
          if ! curl -fsS "$PREV_URL" -o prev-data.js; then
            echo "No previous data.js published yet — nothing to compare against."
            echo "status=nobaseline" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Strip the `window.BENCHMARK_DATA = ` wrapper (and trailing `;` if present),
          # mirroring the publish step below.
          sed -e '1s|^window\.BENCHMARK_DATA *= *||' -e '$s|;[[:space:]]*$||' \
            prev-data.js > prev-data.json

          PREV_BENCHES=$(jq -c '
            (.entries["Quarry Benchmarks"] // []) as $e
            | if ($e | length) == 0 then [] else ($e[-1].benches // []) end' prev-data.json)

          if [ "$(jq 'length' <<<"$PREV_BENCHES")" -eq 0 ]; then
            echo "Previous data.js holds no benchmark entries — nothing to compare against."
            echo "status=nobaseline" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Same shape and same `Quarry_*` filter the publish step uses, so the
          # comparison is against exactly what was stored last time.
          CUR_BENCHES=$(jq -c '[
            .Benchmarks[]
            | select(.Method | startswith("Quarry_"))
            | {
                name: .FullName,
                value: .Statistics.Mean,
                allocated: (.Memory.BytesAllocatedPerOperation // 0)
              }
          ]' BenchmarkDotNet.Artifacts/combined-results.json)

          jq -n --argjson prev "$PREV_BENCHES" --argjson cur "$CUR_BENCHES" '
            ($cur | map({key: .name, value: .}) | from_entries) as $curByName
            | {
                missing: [ $prev[] | select($curByName[.name] == null) | .name ],
                breaches: [
                  $prev[]
                  | . as $p
                  | $curByName[$p.name]
                  | select(. != null)
                  | {
                      name: $p.name,
                      oldMean: $p.value,
                      newMean: .value,
                      meanDelta: (if (($p.value // 0) > 0)
                                  then ((.value - $p.value) / $p.value * 100)
                                  else null end),
                      oldAlloc: ($p.allocated // 0),
                      newAlloc: .allocated
                    }
                  | select(((.meanDelta != null) and (.meanDelta > 15))
                           or (.newAlloc > .oldAlloc))
                ]
              }' > perf-gate.json

          MISSING_COUNT=$(jq '.missing | length' perf-gate.json)
          BREACH_COUNT=$(jq '.breaches | length' perf-gate.json)

          {
            echo "### Benchmark comparison vs previous published run"
            echo
            echo "Commit: \`$(git log -1 --format='%H' HEAD)\` — $(git log -1 --format='%s' HEAD)"
            echo
            if [ "$BREACH_COUNT" -gt 0 ]; then
              echo "Thresholds: mean regression >15%, or any increase in allocated bytes."
              echo
              echo "| Benchmark | Mean before | Mean after | Δ mean | Alloc before | Alloc after |"
              echo "|---|---:|---:|---:|---:|---:|"
              jq -r '.breaches[]
                | "| \(.name) | \(.oldMean | floor) ns | \(.newMean | floor) ns | "
                  + (if .meanDelta == null then "n/a"
                     else ((.meanDelta * 10 | round) / 10 | tostring) + "%" end)
                  + " | \(.oldAlloc) B | \(.newAlloc) B |"' perf-gate.json
            else
              echo "No regressions over threshold (>15% mean, or any allocation increase)."
            fi
            echo
            if [ "$MISSING_COUNT" -gt 0 ]; then
              echo "**Missing expected benchmark series:**"
              echo
              jq -r '.missing[] | "- `\(.)`"' perf-gate.json
            fi
          } > perf-gate.md

          cat perf-gate.md >> "$GITHUB_STEP_SUMMARY"

          echo "missing=$MISSING_COUNT" >> "$GITHUB_OUTPUT"
          echo "breaches=$BREACH_COUNT" >> "$GITHUB_OUTPUT"
          echo "status=compared" >> "$GITHUB_OUTPUT"

      # Handed to the `alert` job, which owns the issues: write scope. Uploaded even when
      # there are no breaches so a run's comparison is always retrievable after the fact.
      - name: Upload perf-gate result
        if: steps.perfgate.outputs.status == 'compared'
        uses: actions/upload-artifact@v4
        with:
          name: perf-gate
          path: |
            perf-gate.md
            perf-gate.json
          retention-days: 30

      - name: Fail on missing benchmark series
        if: >-
          steps.perfgate.outputs.missing != '' && steps.perfgate.outputs.missing != '0' &&
          inputs.allow_missing_series != true
        run: |
          set -euo pipefail
          echo "::error::Benchmark series present in the last published run are absent from this one." \
               "That is a crashed or dropped benchmark, not a performance result. If the series was" \
               "renamed or removed on purpose, re-run this workflow via workflow_dispatch with" \
               "allow_missing_series enabled once, so a new baseline can be published."
          jq -r '.missing[] | "::error::missing benchmark series: \(.)"' perf-gate.json
          exit 1

      - name: Note accepted missing series
        if: >-
          steps.perfgate.outputs.missing != '' && steps.perfgate.outputs.missing != '0' &&
          inputs.allow_missing_series == true
        run: |
          set -euo pipefail
          echo "::warning::allow_missing_series was set — publishing a new baseline without these series."
          jq -r '.missing[] | "::warning::dropped benchmark series: \(.)"' perf-gate.json

      - name: Generate merged HTML report
        run: |
          COMMIT_SHA=$(git log -1 --format='%H' HEAD)
          COMMIT_MSG=$(git log -1 --format='%s' HEAD)
          COMMIT_DATE=$(git log -1 --format='%aI' HEAD)
          mkdir -p BenchmarkDotNet.Artifacts/reports
          dotnet run --project src/Quarry.Benchmarks.Reporter -c Release -- \
            BenchmarkDotNet.Artifacts/combined-results.json \
            BenchmarkDotNet.Artifacts/reports/report.html \
            "$COMMIT_SHA" "$COMMIT_MSG" "$COMMIT_DATE"

      - name: Ensure gh-pages branch exists
        run: |
          TMP_DIR=$(mktemp -d)
          cd "$TMP_DIR"
          git clone "https://x-access-token:${TOKEN}@github.com/Dtronix/Quarry-benchmarks.git" repo
          cd repo
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            echo "gh-pages branch already exists"
          else
            echo "Creating gh-pages branch"
            git config user.name "github-action-benchmark"
            git config user.email "github@users.noreply.github.com"
            git checkout --orphan gh-pages
            git rm -rf . 2>/dev/null || true
            echo "# Quarry Benchmarks" > README.md
            git add README.md
            git commit -m "Initialize gh-pages branch"
            git push origin gh-pages
          fi
          cd /
          rm -rf "$TMP_DIR"
        env:
          TOKEN: ${{ secrets.BENCHMARK_TOKEN }}

      - name: Publish benchmark run (data.js, report, pages, manifest)
        run: |
          COMMIT_SHA=$(git log -1 --format='%H' HEAD)
          COMMIT_MSG=$(git log -1 --format='%s' HEAD)
          COMMIT_DATE_ISO=$(git log -1 --format='%aI' HEAD)
          COMMIT_DATE_PREFIX=$(date -d "$COMMIT_DATE_ISO" -u +%Y-%m-%d)
          SHORT_SHA=${COMMIT_SHA:0:8}
          REPORT_NAME="${COMMIT_DATE_PREFIX}-${SHORT_SHA}.html"

          rm -rf benchmark-store
          git clone --branch gh-pages \
            "https://x-access-token:${TOKEN}@github.com/Dtronix/Quarry-benchmarks.git" \
            benchmark-store
          cd benchmark-store
          git config user.name "github-action-benchmark"
          git config user.email "github@users.noreply.github.com"

          # ── Build the new data.js entry ─────────────────────────────────
          # Commit metadata comes from the GitHub API so we get the same
          # {name, email, username} shape the old action produced.
          COMMIT_OBJ=$(curl -fsS \
            -H "Authorization: Bearer ${TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/commits/${COMMIT_SHA}" | \
            jq '{
              author: ({name: .commit.author.name, email: .commit.author.email}
                       + (if .author and .author.login then {username: .author.login} else {} end)),
              committer: ({name: .commit.committer.name, email: .commit.committer.email}
                          + (if .committer and .committer.login then {username: .committer.login} else {} end)),
              id: .sha,
              message: .commit.message,
              timestamp: .commit.author.date,
              url: .html_url
            }')

          # Build the new run entry. Filters to Quarry_* methods and pulls
          # both Mean (time) and BytesAllocatedPerOperation (memory) in one
          # pass from the BenchmarkDotNet JSON.
          NEW_ENTRY=$(jq -n \
            --argjson commit "$COMMIT_OBJ" \
            --slurpfile bdn ../BenchmarkDotNet.Artifacts/combined-results.json \
            '{
              commit: $commit,
              date: (now * 1000 | floor),
              tool: "benchmarkdotnet",
              benches: [
                $bdn[0].Benchmarks[]
                | select(.Method | startswith("Quarry_"))
                | {
                    name: .FullName,
                    value: .Statistics.Mean,
                    unit: "ns",
                    range: ("± " + (.Statistics.StandardDeviation | tostring)),
                    allocated: (.Memory.BytesAllocatedPerOperation // 0)
                  }
              ]
            }')

          # ── Merge into existing data.js, or seed a fresh file ──────────
          mkdir -p dev/bench/runs
          DATA_JS=dev/bench/data.js
          if [ ! -f "$DATA_JS" ]; then
            printf 'window.BENCHMARK_DATA = %s\n' \
              '{"lastUpdate":0,"repoUrl":"https://github.com/Dtronix/Quarry","entries":{"Quarry Benchmarks":[]}}' \
              > "$DATA_JS"
          fi

          # Strip the `window.BENCHMARK_DATA = ` wrapper (and trailing `;` if present).
          EXISTING_JSON=$(sed -e '1s|^window\.BENCHMARK_DATA *= *||' -e '$s|;[[:space:]]*$||' "$DATA_JS")

          PATCHED_JSON=$(jq --argjson entry "$NEW_ENTRY" \
            '.lastUpdate = (now * 1000 | floor)
             | .entries["Quarry Benchmarks"] += [$entry]
             | .entries["Quarry Benchmarks"] |= (if length > 500 then .[length - 500:] else . end)' \
            <<<"$EXISTING_JSON")

          { printf 'window.BENCHMARK_DATA = '; printf '%s' "$PATCHED_JSON"; } > "$DATA_JS"

          # ── Copy per-run HTML report and static front-end pages ────────
          cp ../BenchmarkDotNet.Artifacts/reports/report.html "dev/bench/runs/${REPORT_NAME}"
          cp ../scripts/benchmark-pages/landing.html index.html
          cp ../scripts/benchmark-pages/README.md README.md
          cp ../scripts/benchmark-pages/dashboard.html dev/bench/index.html
          cp ../scripts/benchmark-pages/runs.html dev/bench/runs/index.html

          # ── Update runs manifest ───────────────────────────────────────
          MANIFEST=dev/bench/runs/runs.json
          if [ ! -f "$MANIFEST" ]; then echo '[]' > "$MANIFEST"; fi
          jq --arg sha "$COMMIT_SHA" \
             --arg msg "$COMMIT_MSG" \
             --arg date "$COMMIT_DATE_ISO" \
             --arg file "$REPORT_NAME" \
             '. + [{sha: $sha, message: $msg, date: $date, file: $file}]
              | sort_by(.date) | reverse | .[0:500]' \
             "$MANIFEST" > "$MANIFEST.tmp"
          mv "$MANIFEST.tmp" "$MANIFEST"

          # Trim old report files beyond 500
          KEEP_FILES=$(jq -r '.[].file' "$MANIFEST" | sort -u)
          for f in dev/bench/runs/*.html; do
            BASENAME=$(basename "$f")
            if [ "$BASENAME" = "index.html" ]; then continue; fi
            if ! grep -qx "$BASENAME" <<<"$KEEP_FILES"; then
              echo "Removing old report: $BASENAME"
              rm -f "$f"
            fi
          done

          git add -A
          if git diff --cached --quiet; then
            echo "No changes to push"
          else
            git commit -m "Add report for ${SHORT_SHA}"
            git push origin gh-pages
          fi
        env:
          TOKEN: ${{ secrets.BENCHMARK_TOKEN }}

  # Separate job so `issues: write` is never held by the job that runs project and NuGet code
  # on the persistent self-hosted runner. It consumes only the perf-gate artifact.
  alert:
    needs: benchmark
    # `always()` so a run that also failed the missing-series check still raises its regressions.
    # The `breaches` output only exists once the comparison completed, so this implies the artifact.
    if: >-
      always() &&
      needs.benchmark.outputs.breaches != '' &&
      needs.benchmark.outputs.breaches != '0'
    runs-on: ubuntu-latest
    # Alert-only, per the perf-gate decision: a GitHub API blip must not turn a clean benchmark
    # run red. The benchmark results are already published by the time this runs.
    continue-on-error: true
    permissions:
      contents: read
      issues: write

    steps:
      - name: Download perf-gate result
        uses: actions/download-artifact@v4
        with:
          name: perf-gate

      - name: File or update the performance regression issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TITLE="Performance regression detected in benchmarks"
          API="https://api.github.com/repos/${GITHUB_REPOSITORY}"

          # Filter by label rather than paging the whole open-issue list: the label is applied at
          # creation, so this is bounded and needs no pagination. An unknown label yields [].
          if ! OPEN=$(curl -fsS \
                -H "Authorization: Bearer ${GH_TOKEN}" \
                -H "Accept: application/vnd.github+json" \
                "${API}/issues?state=open&labels=performance-regression&per_page=100"); then
            OPEN='[]'
          fi

          EXISTING=$(jq -r --arg t "$TITLE" \
            '[.[] | select(.pull_request == null) | select(.title == $t) | .number] | first // empty' \
            <<<"$OPEN")

          if [ -n "$EXISTING" ]; then
            # Comment rather than skip. Skipping silently would mean that once one issue is open,
            # no later regression is ever reported again — and because every successful run
            # publishes a new baseline, the original regression stops being detected too.
            jq -n --rawfile b perf-gate.md \
              '{body: ("Another run breached the thresholds while this issue was open.\n\n" + $b)}' \
              > comment.json
            curl -fsS -X POST \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "${API}/issues/${EXISTING}/comments" \
              -d @comment.json \
              | jq -r '"Commented on issue #'"${EXISTING}"': \(.html_url)"'
            exit 0
          fi

          jq -n --arg t "$TITLE" --rawfile b perf-gate.md \
            '{title: $t, body: $b, labels: ["performance-regression"]}' > issue.json

          curl -fsS -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "${API}/issues" \
            -d @issue.json \
            | jq -r '"Opened issue #\(.number): \(.html_url)"'
